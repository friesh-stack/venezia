<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>myVenezia.com – Ferienwohnungen auf den Inseln der Lagune von Venedig</title>
<meta name="description" content="Ferienwohnungen in Venedig, Burano, Murano, Mazzorbo, Torcello, Lido, Pellestrina, Giudecca und Sant'Erasmo – direkt beim Gastgeber anfragen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1B6CA8; --brand-2:#F4C542; --accent:#D9534F; --bg:#FFFDF8;
  --ink:#1c2430; --muted:#5d6876; --card:#ffffff; --line:#e9e4d8; --water:#d9ecf7;
  --r:14px; --shadow:0 6px 24px rgba(20,40,70,.10);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0f1720; --ink:#eef2f6; --muted:#a3afbd; --card:#16212d; --line:#26323f; --water:#13314a; --shadow:0 6px 24px rgba(0,0,0,.35); }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;line-height:1.2;margin:0 0 .5em}
a{color:var(--brand)}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
/* Header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:60px}
.logo{font-family:"Playfair Display",serif;font-weight:700;font-size:1.35rem;color:var(--ink);text-decoration:none;white-space:nowrap}
.logo span{color:var(--brand)}
.logo i{font-style:normal;color:var(--accent);font-size:.8em}
nav.main{display:flex;gap:18px;margin-left:auto}
nav.main a{color:var(--ink);text-decoration:none;font-weight:500;font-size:.95rem}
nav.main a:hover{color:var(--brand)}
.langs{display:flex;gap:4px;margin-left:12px}
.langs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 7px;font:600 .75rem Inter,sans-serif;cursor:pointer}
.langs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
@media (max-width:820px){ nav.main{display:none} .langs{margin-left:auto} }
@media (max-width:420px){ .logo{font-size:1.1rem} .langs button{padding:3px 5px} }
/* Hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#bfe0f3 0%,#e9f5fb 55%,var(--bg) 100%)}
@media (prefers-color-scheme:dark){ .hero{background:linear-gradient(180deg,#123049 0%,#152a3b 60%,var(--bg) 100%)} }
.hero .wrap{position:relative;z-index:2;padding-top:56px;padding-bottom:200px}
.kicker{display:inline-block;background:var(--brand-2);color:#3a2c00;font-weight:600;font-size:.8rem;letter-spacing:.04em;padding:4px 10px;border-radius:999px;margin-bottom:14px}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);max-width:760px}
.hero p{font-size:1.1rem;color:var(--muted);max-width:620px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:var(--r);padding:12px 18px;font:600 1rem Inter,sans-serif;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{background:var(--card);color:var(--brand);border:1px solid var(--line)}
.btn.warm{background:var(--accent);color:#fff}
.btn.wa{background:#25D366;color:#073b1d}
.houses{position:absolute;left:0;right:0;bottom:0;height:190px;z-index:1}
.houses svg{width:100%;height:100%;display:block}
/* Sections */
section{padding:64px 0}
.sec-head{max-width:680px;margin-bottom:26px}
.sec-head p{color:var(--muted);margin:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:500 .9rem Inter,sans-serif;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.ph{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,var(--c1,#1B6CA8),var(--c2,#F4C542));background-size:cover;background-position:center}
.ph .nm{position:absolute;left:14px;bottom:10px;color:#fff;font:700 1.5rem "Playfair Display",serif;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.ph .cr{position:absolute;right:8px;top:8px;font-size:.68rem;background:rgba(0,0,0,.45);color:#fff;padding:2px 6px;border-radius:6px;text-decoration:none;display:none}
.ph.has .cr{display:block}
.ph.has::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.45))}
.ph .nm,.ph .cr{z-index:1}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.body p{margin:0;color:var(--muted);font-size:.95rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand)}
.meta{font-size:.85rem;color:var(--muted)}
.meta b{color:var(--ink)}
.card .btn{margin-top:auto;align-self:flex-start;padding:9px 14px;font-size:.92rem}
/* Map */
.mapbox{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:820px){ .mapbox{grid-template-columns:1fr} }
.map{background:var(--water);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;max-width:440px;width:100%;justify-self:center}
.map svg{display:block;width:100%;height:auto}
.map .dot{cursor:pointer}
.map .dot circle{fill:var(--accent);stroke:#fff;stroke-width:2}
.map .dot text{font:600 12px Inter,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--water);stroke-width:4px}
.map .dot.on circle{fill:var(--brand-2);r:9}
.mapinfo{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);border:1px solid var(--line)}
/* Stays */
.stay .ph{aspect-ratio:16/10}
.soon{border:2px dashed var(--line);border-radius:var(--r);display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;color:var(--muted);min-height:200px}
/* Form */
.formcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:24px;border:1px solid var(--line);max-width:760px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){ .fgrid{grid-template-columns:1fr} }
label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.88rem}
input,select,textarea{font:400 1rem Inter,sans-serif;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
.full{grid-column:1/-1}
.note{font-size:.85rem;color:var(--muted);margin-top:12px}
.preview{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:.9rem;margin-top:14px;display:none}
/* Hosts */
.hosts{background:linear-gradient(135deg,var(--brand),#0f4a76);color:#fff}
.hosts .sec-head p{color:#d8e8f5}
.hosts .kicker{background:var(--brand-2)}
.hostgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:start}
@media (max-width:820px){ .hostgrid{grid-template-columns:1fr} }
.benefits{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.benefits li{background:rgba(255,255,255,.09);border-radius:var(--r);padding:14px 16px 14px 46px;position:relative}
.benefits li::before{content:"✓";position:absolute;left:16px;top:13px;width:20px;height:20px;border-radius:50%;background:var(--brand-2);color:#3a2c00;font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.price{background:#fff;color:var(--ink);border-radius:var(--r);padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.price .big{font:700 3rem "Playfair Display",serif;color:var(--brand);line-height:1}
.price .zero{display:inline-block;margin:12px 0 4px;background:var(--brand-2);color:#3a2c00;font-weight:700;padding:4px 10px;border-radius:8px}
.price p{color:#5d6876;font-size:.92rem}
.soonbox{margin-top:14px;font-size:.88rem;background:#fff7dc;color:#5a4500;padding:10px 12px;border-radius:10px}
/* Footer */
footer{padding:40px 0 60px;border-top:1px solid var(--line);font-size:.9rem;color:var(--muted)}
.fcols{display:flex;flex-wrap:wrap;gap:18px 28px;justify-content:space-between}
footer a{color:var(--muted)}
.sig{margin-top:18px;font-size:.82rem}
.applink{display:inline-block;margin-top:8px;padding:5px 10px;border-radius:8px;background:#111827;color:#fff!important;text-decoration:none;font-size:.8rem}
.applink b{color:#FF6A3D}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,20,30,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 0 22px}
@media (min-width:720px){ .modal{align-items:center} .sheet{border-radius:18px} }
.sheet .ph{aspect-ratio:16/9}
.sheet .in{padding:18px 22px}
.x{position:sticky;top:10px;float:right;margin:10px 10px -46px 0;z-index:3;border:0;background:rgba(0,0,0,.55);color:#fff;width:36px;height:36px;border-radius:50%;font-size:1.2rem;cursor:pointer}
.legal h3{margin-top:1.2em;font-size:1.1rem}
.legal p{color:var(--muted);font-size:.92rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;display:none;z-index:60}
</style>
</head>

<header>
  <div class="wrap bar">
    <a class="logo" href="#top">my<span>Venezia</span><i>.com</i></a>

<section id="gastgeber" class="hosts">
  <div class="wrap">

      <span class="kicker" data-t="host_kicker"></span>

      <p data-t="host_sub"></p>
    </div>

        <li data-t="b1"></li><li data-t="b2"></li><li data-t="b3"></li><li data-t="b4"></li>
      </ul>

        <div class="meta" data-t="price_title"></div>
        <div class="big">99 €</div>
        <p data-t="price_note" style="margin:.4em 0 0"></p>
        <span class="zero" data-t="zero"></span>
        <p data-t="compare"></p>
        <a class="btn warm" id="hostMail" href="#" data-t="host_cta"></a>
        <div class="soonbox" data-t="host_soon"></div>
      </div>
    </div>
  </div>
</section>
</main>

<footer>
  <div class="wrap">
    <div class="fcols">
      <div>
        <div class="logo" style="font-size:1.2rem">my<span>Venezia</span><i>.com</i></div>

<div class="modal" id="modal" role="dialog" aria-modal="true">

/* ============ LOGIK ============ */
let lang = 'de', filter = 'all';
const $ = s => document.querySelector(s);
const t = k => (T[lang] && T[lang][k] != null) ? T[lang][k] : T.de[k];
const iname = id => (NAMES[id] && NAMES[id][lang]) || DEF_NAMES[id];
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function pickLang(){
  const saved = store.get('lagunabnb_lang');
  if (saved && T[saved]) return saved;
  const n = (navigator.language||'de').slice(0,2).toLowerCase();
  return T[n] ? n : 'en';
}

/* Fotos: 1. eigenes Foto (fotos/<id>.jpg) → 2. Wikipedia-Titelbild → 3. Farbverlauf */
const imgCache = {};
function tryImage(src){ return new Promise(res=>{ const i=new Image(); i.onload=()=>res(src); i.onerror=()=>res(null); i.src=src; }); }
async function wikiImage(title){
  if (title in imgCache) return imgCache[title];
  let out = null;
  try{
    const ss = sessionStorage.getItem('wimg_'+title);
    if (ss) { out = JSON.parse(ss); imgCache[title]=out; return out; }
  }catch(e){}
  try{
    const r = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title.replace(/ /g,'_')));
    if (r.ok){
      const j = await r.json();
      let src = j.thumbnail && j.thumbnail.source;
      const orig = j.originalimage && j.originalimage.source;
      if (src && !/\.svg/i.test(orig||'')){
        src = src.replace(/\/\d+px-/, '/900px-');
        const file = decodeURIComponent((orig||src).split('/').pop());
        out = {src, credit:'https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(file)};
      }
    }
  }catch(e){}
  imgCache[title]=out;
  try{ sessionStorage.setItem('wimg_'+title, JSON.stringify(out)); }catch(e){}
  return out;
}
async function fillPhoto(el, own, wikiTitle){
  if (own){ const ok = await tryImage(CONFIG.photoFolder+own); if (ok){ el.style.backgroundImage=`url("${ok}")`; el.classList.add('has'); el.querySelector('.cr')?.remove(); return; } }
  if (!wikiTitle) return;
  const w = await wikiImage(wikiTitle);
  if (!w) return;
  const ok = await tryImage(w.src);
  if (!ok) return;
  el.style.backgroundImage = `url("${ok}")`; el.classList.add('has');
  const cr = el.querySelector('.cr'); if (cr){ cr.href = w.credit; cr.textContent = '© Wikimedia'; }
}
function photoBox(island, own, label){
  const d = document.createElement('div');
  d.className='ph'; d.style.setProperty('--c1',island.c[0]); d.style.setProperty('--c2',island.c[1]);
  d.innerHTML = `<a class="cr" target="_blank" rel="noopener"></a><div class="nm">${label}</div>`;
  fillPhoto(d, own, island.wiki);
  return d;
}

function islandCard(isl){
  const c = document.createElement('article'); c.className='card';
  c.appendChild(photoBox(isl, isl.id+'.jpg', iname(isl.id)));
  const b = document.createElement('div'); b.className='body';
  b.innerHTML = `<div class="tags">${isl.tags.map(x=>`<span class="tag">${t('tag_'+x)}</span>`).join('')}</div>
    <p>${isl.t[lang]||isl.t.de}</p>
    <div class="meta">⛴ ${t('lines')}: <b>${isl.lines==='hub'?t('hub'):isl.lines}</b></div>
    <a class="btn ghost" href="#anfrage" data-ask="${isl.id}">${t('ask_here')} →</a>`;
  c.appendChild(b);
  c.querySelector('.ph').style.cursor='pointer';
  c.querySelector('.ph').addEventListener('click',()=>openIsland(isl.id));
  return c;
}
function renderIslands(){

/* Schematische Karte */
const BOX = {latMin:45.255, latMax:45.515, lonMin:12.255, lonMax:12.475, w:360, h:520};
const px = (lat,lon) => [ (lon-BOX.lonMin)/(BOX.lonMax-BOX.lonMin)*BOX.w, (BOX.latMax-lat)/(BOX.latMax-BOX.latMin)*BOX.h ];
function renderMap(){
  const P = (a,b)=>px(a,b).map(v=>v.toFixed(1)).join(',');
  const lido = `M${P(45.432,12.392)} L${P(45.40,12.372)} L${P(45.37,12.345)} L${P(45.338,12.318)}`;
  const pel  = `M${P(45.330,12.312)} L${P(45.30,12.305)} L${P(45.265,12.298)}`;
  const main = `M0,0 L${P(45.515,12.325)} Q${P(45.47,12.30)} ${P(45.45,12.255)} L0,${px(45.40,12.255)[1].toFixed(1)} Z`;
  let s = `<rect width="360" height="520" fill="var(--water)"/>
    <path d="${main}" fill="#cfd8c4" opacity=".9"/>
    <rect x="${px(45.5,12.475)[0]-60}" y="0" width="60" height="520" fill="#9cc9e6" opacity=".55"/>
    <text x="345" y="300" transform="rotate(90 345 300)" font-family="Inter" font-size="12" fill="#2b5876" opacity=".8">ADRIA · ADRIATICO</text>
    <path d="${lido}" stroke="#e6d9b0" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="${pel}" stroke="#e6d9b0" stroke-width="6" stroke-linecap="round" fill="none"/>
    <text x="14" y="40" font-family="Inter" font-size="11" fill="#4c5a3e">Mestre</text>`;
  ISLANDS.forEach(i=>{
    const [x,y] = px(i.lat,i.lon);
    const right = !['mazzorbo','giudecca','pellestrina'].includes(i.id);
    s += `<g class="dot" data-id="${i.id}" tabindex="0"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7"/>
      <text x="${(x+(right?11:-11)).toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${right?'start':'end'}">${iname(i.id)}</text></g>`;
  });
  $('#mapSvg').innerHTML = s;
}
function selectOnMap(id){
  document.querySelectorAll('.map .dot').forEach(d=>d.classList.toggle('on', d.dataset.id===id));
  const i = ISLANDS.find(x=>x.id===id);

    <p>${i.t[lang]||i.t.de}</p><div class="meta">⛴ ${t('lines')}: <b>${i.lines==='hub'?t('hub'):i.lines}</b></div>
    <div class="btns"><button class="btn ghost" data-open="${id}">${t('more')}</button><a class="btn primary" href="#anfrage" data-ask="${id}">${t('ask_here')} →</a></div>`;
}

function fmtDate(v){ if(!v) return '–'; try{ return new Date(v+'T12:00').toLocaleDateString(lang==='zh'?'zh-CN':lang); }catch(e){ return v; } }
function buildMsg(){
  const name = $('#fName').value.trim();
  if (!name){ toast(t('need_name')); $('#fName').focus(); return null; }
  const isl = $('#fIsland').value; const islTxt = isl==='any' ? t('f_any') : iname(isl);
  const msg = $('#fMsg').value.trim();
  return `${t('m_hello')}\n\n${t('m_req')}\n\n${t('f_island')}: ${islTxt}\n${t('f_from')}: ${fmtDate($('#fFrom').value)}\n${t('f_to')}: ${fmtDate($('#fTo').value)}\n${t('f_guests')}: ${$('#fGuests').value}` + (msg?`\n\n${msg}`:'') + `\n\n${t('m_bye')}\n${name}`;
}
function showPreview(txt){ const p=$('#preview'); p.textContent=txt; p.style.display='block'; }
function toast(m){ const el=$('#toast'); el.textContent=m; el.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>el.style.display='none',2200); }

function houses(){
  const cols = ['#D9534F','#F4C542','#1B6CA8','#6E8B5A','#E8833A','#8E5BA8','#2BA3A3','#F28CA0','#F4C542','#D9534F','#1B6CA8','#6E8B5A'];
  let x=0, out='', k=0;
  while (x < 1200){
    const w = 70 + (k*37)%45, h = 70 + (k*53)%60, c = cols[k%cols.length];
    const y = 160-h;
    out += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
    out += `<rect x="${x}" y="${y}" width="${w}" height="6" fill="#ffffff" opacity=".35"/>`;
    const cols2 = Math.max(2, Math.floor(w/28));
    for (let r=0;r<Math.floor((h-30)/32);r++) for (let q=0;q<cols2;q++){
      const wx = x + 10 + q*((w-20)/cols2) + 2, wy = y + 16 + r*32;
      out += `<rect x="${wx.toFixed(1)}" y="${wy}" width="12" height="18" rx="2" fill="#2a3a4a" opacity=".55"/><rect x="${(wx-3).toFixed(1)}" y="${wy}" width="3" height="18" fill="#1d6b4e" opacity=".7"/>`;
    }
    out += `<rect x="${(x+w/2-9).toFixed(1)}" y="138" width="18" height="22" rx="2" fill="#3a2a1a" opacity=".7"/>`;
    if (k===4){ out += `<rect x="${x+w+4}" y="18" width="22" height="142" fill="#e7dccb"/><path d="M${x+w+2} 18 L${x+w+15} 0 L${x+w+28} 18 Z" fill="#8a6e4a"/>`; x+=30; }
    x += w; k++;
  }
  $('#houseRow').innerHTML = out;
}

document.addEventListener('click', e=>{
  const l = e.target.closest('[data-l]'); if (l){ lang=l.dataset.l; store.set('lagunabnb_lang',lang); renderAll(); return; }
  const f = e.target.closest('[data-f]'); if (f){ filter=f.dataset.f; renderFilters(); renderIslands(); return; }
  const a = e.target.closest('[data-ask]'); if (a){ closeModal(); fillIslandSelect(a.dataset.ask); return; }
  const o = e.target.closest('[data-open]'); if (o){ openIsland(o.dataset.open); return; }
  const d = e.target.closest('.map .dot'); if (d){ selectOnMap(d.dataset.id); return; }
  if (e.target.id==='modal' || e.target.id==='closeModal'){ closeModal(); }
});
